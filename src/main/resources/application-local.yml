spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL} # Вместо jdbc:postgresql://postgres:5432/skillmatch
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

skillmatch:
  hh-import:
    enabled: true
    maxPages: 0
    maxDetails: 0
    fixedDelayMs: 1800000
    initialDelayMs: 15000

server:
  port: 8080

app:
  mail:
    logCodes: true
