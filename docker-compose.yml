services:
  postgres:
    image: postgres:16
    container_name: skillmatch-postgres
    environment:
      POSTGRES_DB: skillmatch
      POSTGRES_USER: skillmatch
      POSTGRES_PASSWORD: skillmatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillmatch -d skillmatch"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
    container_name: skillmatch-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/skillmatch
      SPRING_DATASOURCE_USERNAME: skillmatch
      SPRING_DATASOURCE_PASSWORD: skillmatch
    ports:
      - "8080:8080"

volumes:
  pgdata:
