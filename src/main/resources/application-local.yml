spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/skillmatch
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# В локалке не отправляем emails (JavaMailSender подменяется на no-op Bean).

skillmatch:
  hh-import:
    enabled: true
    # на каждое срабатывание (раз в 30 мин) будет пытаться взять до 75 новых детальных вакансий
    maxPages: 3
    maxDetails: 75
    fixedDelayMs: 1800000
    initialDelayMs: 15000

server:
  port: 8080

app:
  mail:
    logCodes: true
